<meta charset="UTF-8">

<style>

/* =========================
   LIGHT PREMIUM THEME
   ========================= */

:root {
    --bg: #e9e4da;
    --panel: #f2eee6;
    --panel2: #e4ded2;

    --text: #202126;
    --muted: #74716a;

    --border: rgba(40, 37, 32, 0.10);

    --accent: #7566d8;
    --accent-light: rgba(117, 102, 216, 0.13);

    --green: #3f8f7b;
    --red: #c65d68;

    --shadow:
        0 15px 40px rgba(57, 50, 40, 0.12);
}


/* =========================
   BASIC RESET
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;
}

body {
    min-height: 100vh;
}


/* =========================
   APP CONTAINER
   ========================= */

.app {
    width: min(100%, 520px);

    margin: auto;

    padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(24px + env(safe-area-inset-bottom));
}


/* =========================
   HEADER
   ========================= */

.top {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 12px;

    margin-bottom: 16px;
}

.eyebrow {
    font-size: 12px;

    color: var(--muted);

    letter-spacing: .08em;

    text-transform: uppercase;
}

h1 {
    font-size: 29px;

    line-height: 1.05;

    margin: 5px 0 0;

    letter-spacing: -.04em;
}

.clock {
    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;

    font-variant-numeric: tabular-nums;
}

.tz {
    font-size: 10px;

    color: var(--muted);

    font-weight: 600;

    text-align: right;

    margin-top: 2px;
}


/* =========================
   NEXT CLASS HERO
   ========================= */

.hero {
    background:
        linear-gradient(
            145deg,
            #f4f0e8,
            #ddd6c9
        );

    border: 1px solid var(--border);

    border-radius: 26px;

    padding: 18px;

    box-shadow: var(--shadow);

    position: relative;

    overflow: hidden;
}

.hero::after {
    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    border-radius: 50%;

    right: -75px;
    top: -80px;

    background:
        radial-gradient(
            circle,
            rgba(117,102,216,.20),
            transparent 65%
        );

    pointer-events: none;
}

.hero-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;
}

.hero-date {
    font-size: 13px;

    color: var(--muted);

    margin-bottom: 6px;
}

.next-title {
    font-size: 21px;

    font-weight: 800;

    letter-spacing: -.03em;
}

.next-sub {
    font-size: 13px;

    color: var(--muted);

    margin-top: 4px;
}

.count {
    background: var(--accent-light);

    color: var(--accent);

    border: 1px solid rgba(117,102,216,.20);

    padding: 8px 10px;

    border-radius: 14px;

    font-size: 12px;

    font-weight: 800;

    white-space: nowrap;
}


/* =========================
   CONTROLS
   ========================= */

.controls {
    display: flex;

    gap: 8px;

    margin: 14px 0;
}

.select,
.search {
    width: 100%;

    background: var(--panel);

    color: var(--text);

    border: 1px solid var(--border);

    border-radius: 14px;

    padding: 12px 13px;

    outline: none;

    font-size: 16px;
}

.search {
    margin-bottom: 12px;
}

.select:focus,
.search:focus {
    border-color: var(--accent);
}


/* =========================
   SECTION HEADINGS
   ========================= */

.section-title {
    display: flex;

    align-items: end;

    justify-content: space-between;

    margin: 20px 2px 10px;
}

.section-title h2 {
    font-size: 17px;

    margin: 0;

    letter-spacing: -.02em;
}

.section-title span {
    font-size: 11px;

    color: var(--muted);
}


/* =========================
   DAYS
   ========================= */

.day {
    margin-bottom: 12px;
}

.day-head {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 4px;
}

.day-name {
    font-weight: 800;

    font-size: 14px;
}

.day-date {
    font-size: 12px;

    color: var(--muted);
}


/* =========================
   CLASS CARD
   ========================= */

.card {
    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 19px;

    padding: 14px;

    margin-bottom: 8px;

    display: flex;

    gap: 12px;

    align-items: center;

    transition: .18s;
}

.card.today {
    border-color:
        rgba(117,102,216,.45);

    background:
        linear-gradient(
            145deg,
            #eeeaf7,
            #e7e1d7
        );
}

.time {
    width: 82px;

    flex: 0 0 82px;
}

.time strong {
    font-size: 13px;

    display: block;
}

.time small {
    font-size: 11px;

    color: var(--muted);

    display: block;

    margin-top: 3px;
}

.info {
    min-width: 0;

    flex: 1;
}

.code {
    font-size: 16px;

    font-weight: 900;

    letter-spacing: -.02em;
}

.subject {
    font-size: 12px;

    color: var(--muted);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-top: 2px;
}

.meta {
    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-top: 8px;
}

.pill {
    font-size: 10px;

    font-weight: 750;

    color: #4c4a45;

    background: var(--panel2);

    border: 1px solid var(--border);

    border-radius: 999px;

    padding: 5px 7px;
}

.dot {
    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: var(--accent);

    margin-left: auto;

    flex: 0 0 9px;
}


/* =========================
   EMPTY STATE
   ========================= */

.empty {
    padding: 24px 14px;

    text-align: center;

    color: var(--muted);

    background: var(--panel);

    border: 1px dashed var(--border);

    border-radius: 18px;
}


/* =========================
   COURSE CARDS
   ========================= */

.course {
    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 15px;

    margin-bottom: 8px;
}

.course-top {
    display: flex;

    justify-content: space-between;

    gap: 10px;
}

.course-code {
    font-size: 17px;

    font-weight: 900;
}

.course-prof {
    font-size: 12px;

    color: var(--muted);

    text-align: right;
}

.course-name {
    font-size: 13px;

    margin-top: 7px;

    color: #48463f;

    line-height: 1.35;
}

.course-count {
    font-size: 11px;

    color: var(--muted);

    margin-top: 10px;
}


/* =========================
   HOLIDAY CARDS
   ========================= */

.holiday {
    background:
        linear-gradient(
            145deg,
            #eee1df,
            #e8ddd5
        );

    border:
        1px solid
        rgba(198,93,104,.22);

    border-radius: 18px;

    padding: 16px;

    margin-bottom: 9px;
}

.holiday-date {
    font-size: 11px;

    color: var(--red);

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .06em;
}

.holiday-name {
    font-size: 18px;

    font-weight: 900;

    margin-top: 5px;
}

.holiday-type {
    font-size: 12px;

    color: var(--muted);

    margin-top: 3px;
}


/* =========================
   BOTTOM NAVIGATION
   ========================= */

.nav {
    position: sticky;

    bottom:
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    background:
        rgba(228,222,210,.92);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 7px;

    margin-top: 18px;

    box-shadow: var(--shadow);
}

.nav button {
    border: 0;

    background: transparent;

    border-radius: 14px;

    padding: 11px 6px;

    font-size: 11px;

    font-weight: 800;

    color: var(--muted);

    min-height: 44px;

    cursor: pointer;
}

.nav button.active {
    background: var(--accent-light);

    color: var(--accent);
}


/* =========================
   UTILITY
   ========================= */

.hidden {
    display: none !important;
}


/* =========================
   DESKTOP
   ========================= */

@media (min-width: 700px) {

    .app {
        padding-top: 34px;
    }

    .nav {
        position: static;
    }
}

</style>
</head>

    </div>


    <!-- HOLIDAYS -->

    <div

        <div class="section-title">

            <h2>
                Holidays
            </h2>

            <span>
                From timetable
            </span>

        </div>

        <div id="holidayList"></div>

    </div>


    <!-- NAVIGATION -->

    <nav
        class="nav"
        aria-label="Main navigation">

        <button
            class="active"
            data-view="Today">
            Today
        </button>

        <button
            data-view="Week">
            Week
        </button>

        <button
            data-view="Courses">
            Courses
        </button>

        <button
            data-view="Holidays">
            Holidays
        </button>

    </nav>

</div>

/* =====================================================
   DATE FUNCTIONS
   ===================================================== */

function parseDate(dateString) {

    const [
        year,
        month,
        day
    ] = dateString
        .split("-")
        .map(Number);

    return new Date(
        Date.UTC(
            year,
            month - 1,
            day
        )
    );
}


function dateKey() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Asia/Kolkata",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(new Date());
}


function formatDate(
    dateString,
    options = {
        weekday: "short",
        month: "short",
        day: "numeric"
    }
) {

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            timeZone: "Asia/Kolkata",
            ...options
        }
    ).format(
        parseDate(dateString)
    );
}


/* =====================================================
   LIVE 12-HOUR CLOCK
   ===================================================== */

function formatClock() {

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            timeZone: "Asia/Kolkata",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }
    ).format(new Date());

}


/* =====================================================
   CONVERT TIME TO MINUTES
   ===================================================== */

function minutes(time) {

    const match =
        time.match(
            /(\d+):(\d+)\s*(AM|PM)/i
        );

    if (!match)
        return 0;

    let hour = Number(match[1]);

    const minute =
        Number(match[2]);

    const period =
        match[3].toUpperCase();

    if (
        period === "AM" &&
        hour === 12
    ) {
        hour = 0;
    }

    if (
        period === "PM" &&
        hour !== 12
    ) {
        hour += 12;
    }

    return (
        hour * 60 +
        minute
    );
}


/* =====================================================
   CREATE CLASS CARD
   ===================================================== */

function card(item) {

    const today =
        item.date === dateKey();

    return `

    <article
        class="card ${today ? "today" : ""}">

        <div class="time">

            <strong>
                ${item.start}
            </strong>

            <small>
                to ${item.end}
            </small>

        </div>


        <div class="info">

            <div class="code">
                ${item.code}
            </div>

            <div class="subject">
                ${item.subject}
            </div>


            <div class="meta">

                <span class="pill">
                    ${item.prof}
                </span>

                <span class="pill">
                    ${item.room}
                </span>

                <span class="pill">
                    ${item.week}
                </span>

            </div>

        </div>


        <span
            class="dot"
            aria-hidden="true">
        </span>

    </article>

    `;
}


/* =====================================================
   GROUP CLASSES BY DATE
   ===================================================== */

function grouped(items) {

    const result = {};

    items.forEach(item => {

        if (!result[item.date]) {

            result[item.date] = [];

        }

        result[item.date].push(item);

    });


    Object.values(result)
        .forEach(list => {

            list.sort(
                (a,b) =>
                    minutes(a.start) -
                    minutes(b.start)
            );

        });

    return result;
}


/* =====================================================
   TODAY
   ===================================================== */

function renderToday() {

    const today =
        dateKey();

    const list =
        DATA
            .filter(
                item =>
                    item.date === today
            )
            .sort(
                (a,b) =>
                    minutes(a.start) -
                    minutes(b.start)
            );


    document.getElementById(
        "todayLabel"
    ).textContent =
        formatDate(
            today,
            {
                weekday: "long",
                month: "long",
                day: "numeric"
            }
        );


    if (list.length) {

        document.getElementById(
            "todayList"
        ).innerHTML =
            list.map(card).join("");

    } else {

        const holiday =
            HOLIDAYS.some(
                h => h[0] === today
            );


        document.getElementById(
            "todayList"
        ).innerHTML = `

        <div class="empty">

            ${
                holiday
                ? "Holiday — no selected classes today."
                : "No selected classes today."
            }

        </div>

        `;

    }

}


/* =====================================================
   WEEK VIEW
   ===================================================== */

function renderWeek() {

    const week =
        state.week;


    let list =
        DATA.filter(
            item =>
                item.week === week
        );


    if (
        state.course !== "ALL"
    ) {

        list =
            list.filter(
                item =>
                    item.code ===
                    state.course
            );

    }


    const search =
        state.search
            .trim()
            .toLowerCase();


    if (search) {

        list =
            list.filter(
                item => {

                    const text =
                        `
                        ${item.code}
                        ${item.subject}
                        ${item.prof}
                        ${item.room}
                        `
                        .toLowerCase();

                    return text.includes(
                        search
                    );

                }
            );

    }


    const groups =
        grouped(list);


    const dates =
        Object.keys(groups)
            .sort();


    if (!dates.length) {

        document.getElementById(
            "weekList"
        ).innerHTML = `

        <div class="empty">

            No matching classes
            in ${week}.

        </div>

        `;

        return;
    }


    document.getElementById(
        "weekList"
    ).innerHTML =

        dates.map(date => `

        <section class="day">

            <div class="day-head">

                <span class="day-name">
                    ${
                        formatDate(
                            date,
                            {
                                weekday: "long"
                            }
                        )
                    }
                </span>

                <span class="day-date">
                    ${formatDate(date)}
                </span>

            </div>


            ${
                groups[date]
                    .map(card)
                    .join("")
            }

        </section>

        `).join("");

}

/* =====================================================
   FIND NEXT CLASS
   ===================================================== */

function findNext() {

    const today =
        dateKey();


    const sorted =
        [...DATA].sort(
            (a,b) => {

                if (
                    a.date !==
                    b.date
                ) {

                    return a.date.localeCompare(
                        b.date
                    );

                }

                return (
                    minutes(a.start) -
                    minutes(b.start)
                );

            }
        );


    const currentTime =
        new Date();


    const currentHour =
        Number(
            new Intl.DateTimeFormat(
                "en-IN",
                {
                    timeZone:
                        "Asia/Kolkata",

                    hour:
                        "2-digit",

                    hour12:false
                }
            ).format(currentTime)
        );


    const currentMinute =
        Number(
            new Intl.DateTimeFormat(
                "en-IN",
                {
                    timeZone:
                        "Asia/Kolkata",

                    minute:
                        "2-digit",

                    hour12:false
                }
            ).format(currentTime)
        );


    const currentMinutes =
        currentHour * 60 +
        currentMinute;


    let next =
        sorted.find(
            item =>

                item.date > today ||

                (
                    item.date === today &&
                    minutes(item.start) >
                    currentMinutes
                )
        );


    if (!next) {

        next = sorted[0];

    }


    document.getElementById(
        "heroDate"
    ).textContent =

        next.date === today

        ? "NEXT CLASS"

        : formatDate(
            next.date,
            {
                weekday:"short",
                month:"short",
                day:"numeric"
            }
        );


    document.getElementById(
        "nextTitle"
    ).textContent =

        `${next.code} · ${next.start}`;


    document.getElementById(
        "nextSub"
    ).textContent =

        `${next.prof} · ${next.room}`;


    document.getElementById(
        "classCount"
    ).textContent =

        `${DATA.length} classes`;

}


/* =====================================================
   CHANGE VIEW
   ===================================================== */

function setView(view) {

    state.view =
        view;


    [
        "Today",
        "Week",
        "Courses",
        "Holidays"
    ]
    .forEach(name => {

        document
            .getElementById(
                "view" + name
            )
            .classList.toggle(
                "hidden",
                name !== view
            );


        document
            .querySelector(
                `[data-view="${name}"]`
            )
            .classList.toggle(
                "active",
                name === view
            );

    });

}
