<meta name="theme-color" content="#e8ddc8">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<style>

/* =========================================
   LIGHT BEIGE THEME
   ========================================= */

:root {
    --bg: #e8ddc8;
    --panel: #f1e8d8;
    --panel2: #e3d6c1;

    --text: #2d2923;
    --muted: #756d61;

    --line: rgba(65,52,36,.12);

    --accent: #8b6f47;
    --accent2: #a8793d;

    --danger: #b85c4a;

    --shadow:
        0 18px 50px rgba(91,69,40,.14);
}


/* =========================================
   RESET
   ========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;
}

body {
    min-height: 100vh;
}

button {
    font: inherit;
    color: inherit;
}


/* =========================================
   APP
   ========================================= */

.app {
    width: min(100%, 520px);

    margin: auto;

    padding:
        calc(16px + env(safe-area-inset-top))
        14px
        calc(24px + env(safe-area-inset-bottom));
}


/* =========================================
   HEADER
   ========================================= */

.top {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 12px;

    margin-bottom: 16px;
}

.eyebrow {
    font-size: 12px;

    color: var(--muted);

    letter-spacing: .08em;

    text-transform: uppercase;
}

h1 {
    font-size: 29px;

    line-height: 1.05;

    margin: 5px 0 0;

    letter-spacing: -.04em;
}

.clock {
    font-variant-numeric: tabular-nums;

    text-align: right;

    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;
}

.tz {
    font-size: 10px;

    color: var(--muted);

    font-weight: 600;

    text-align: right;

    margin-top: 2px;
}


/* =========================================
   NEXT CLASS
   ========================================= */

.hero {
    background:
        linear-gradient(
            145deg,
            #f4ecdf,
            #e4d7c1
        );

    border: 1px solid var(--line);

    border-radius: 26px;

    padding: 18px;

    box-shadow: var(--shadow);

    position: relative;

    overflow: hidden;
}

.hero:after {
    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    border-radius: 50%;

    right: -75px;
    top: -80px;

    background:
        radial-gradient(
            circle,
            rgba(168,121,61,.20),
            transparent 65%
        );

    pointer-events: none;
}

.hero-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;
}

.hero-date {
    font-size: 13px;

    color: var(--muted);

    margin-bottom: 6px;
}

.next-title {
    font-size: 21px;

    font-weight: 800;

    letter-spacing: -.03em;
}

.next-sub {
    font-size: 13px;

    color: var(--muted);

    margin-top: 4px;
}

.count {
    background:
        rgba(139,111,71,.12);

    border:
        1px solid
        rgba(139,111,71,.20);

    padding: 8px 10px;

    border-radius: 14px;

    font-size: 12px;

    font-weight: 800;

    white-space: nowrap;
}


/* =========================================
   CONTROLS
   ========================================= */

.controls {
    display: flex;

    gap: 8px;

    margin: 14px 0;
}

.select,
.search {
    width: 100%;

    background: var(--panel);

    color: var(--text);

    border:
        1px solid
        var(--line);

    border-radius: 14px;

    padding: 12px 13px;

    outline: none;

    font-size: 16px;
}

.search {
    margin-bottom: 12px;
}

.select:focus,
.search:focus {
    border-color: var(--accent);
}


/* =========================================
   SECTION TITLES
   ========================================= */

.section-title {
    display: flex;

    align-items: end;

    justify-content: space-between;

    margin: 20px 2px 10px;
}

.section-title h2 {
    font-size: 17px;

    margin: 0;

    letter-spacing: -.02em;
}

.section-title span {
    font-size: 11px;

    color: var(--muted);
}


/* =========================================
   DAYS
   ========================================= */

.day {
    margin-bottom: 12px;
}

.day-head {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 8px 4px;
}

.day-name {
    font-weight: 800;

    font-size: 14px;
}

.day-date {
    font-size: 12px;

    color: var(--muted);
}


/* =========================================
   CLASS CARD
   ========================================= */

.card {
    background: var(--panel);

    border:
        1px solid
        var(--line);

    border-radius: 19px;

    padding: 14px;

    margin-bottom: 8px;

    display: flex;

    gap: 12px;

    align-items: center;

    transition: .18s;
}

.card.today {
    border-color:
        rgba(139,111,71,.42);

    background:
        linear-gradient(
            145deg,
            #f5ecdf,
            #eadfcb
        );
}

.time {
    width: 82px;

    flex: 0 0 82px;
}

.time strong {
    font-size: 13px;

    display: block;
}

.time small {
    font-size: 11px;

    color: var(--muted);

    display: block;

    margin-top: 3px;
}

.info {
    min-width: 0;

    flex: 1;
}

.code {
    font-size: 16px;

    font-weight: 900;

    letter-spacing: -.02em;
}

.subject {
    font-size: 12px;

    color: var(--muted);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-top: 2px;
}

.meta {
    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    margin-top: 8px;
}

.pill {
    font-size: 10px;

    font-weight: 750;

    color: #4a4136;

    background: var(--panel2);

    border:
        1px solid
        var(--line);

    border-radius: 999px;

    padding: 5px 7px;
}

.dot {
    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: var(--accent);

    margin-left: auto;

    flex: 0 0 9px;
}


/* =========================================
   EMPTY STATE
   ========================================= */

.empty {
    padding: 24px 14px;

    text-align: center;

    color: var(--muted);

    background: var(--panel);

    border:
        1px dashed
        var(--line);

    border-radius: 18px;
}


/* =========================================
   COURSE CARDS
   ========================================= */

.course {
    background: var(--panel);

    border:
        1px solid
        var(--line);

    border-radius: 18px;

    padding: 15px;

    margin-bottom: 8px;
}

.course-top {
    display: flex;

    justify-content: space-between;

    gap: 10px;
}

.course-code {
    font-size: 17px;

    font-weight: 900;
}

.course-prof {
    font-size: 12px;

    color: var(--muted);

    text-align: right;
}

.course-name {
    font-size: 13px;

    margin-top: 7px;

    color: #4a4136;

    line-height: 1.35;
}

.course-count {
    font-size: 11px;

    color: var(--muted);

    margin-top: 10px;
}


/* =========================================
   HOLIDAY / NO CLASS CARDS
   BURGER-KING STYLE BEIGE
   ========================================= */

.holiday,
.no-class {

    background:
        linear-gradient(
            145deg,
            #d3a064,
            #c28c4f
        );

    border:
        1px solid
        rgba(255,255,255,.28);

    color: #fff;

    border-radius: 19px;

    padding: 16px;

    margin-bottom: 9px;

    box-shadow:
        0 10px 24px
        rgba(112,75,35,.14);
}

.holiday-date,
.no-class-date {

    font-size: 11px;

    color: #fff;

    opacity: .92;

    font-weight: 850;

    text-transform: uppercase;

    letter-spacing: .07em;
}

.holiday-name,
.no-class-name {

    font-size: 18px;

    color: #fff;

    font-weight: 900;

    margin-top: 5px;
}

.holiday-type,
.no-class-type {

    font-size: 12px;

    color: #fff;

    opacity: .9;

    margin-top: 4px;
}


/* =========================================
   BOTTOM NAVIGATION
   ========================================= */

.nav {

    position: sticky;

    bottom:
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 7px;

    background:
        rgba(226,214,193,.94);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border:
        1px solid
        var(--line);

    border-radius: 20px;

    padding: 7px;

    margin-top: 18px;

    box-shadow: var(--shadow);
}

.nav button {

    border: 0;

    background: transparent;

    border-radius: 14px;

    padding: 11px 6px;

    font-size: 11px;

    font-weight: 800;

    color: var(--muted);

    min-height: 44px;

    cursor: pointer;
}

.nav button.active {

    background:
        rgba(139,111,71,.15);

    color: #5c452c;
}


/* =========================================
   HIDDEN
   ========================================= */

.hidden {
    display: none !important;
}


/* =========================================
   DESKTOP
   ========================================= */

@media (min-width:700px) {

    .app {
        padding-top: 34px;
    }

    .nav {
        position: static;
    }

}

</style>
</head>

</div>


<!-- ======================================
     COURSES
     ====================================== -->

<div

    <div class="section-title">

        <h2>
            My courses
        </h2>

        <span>
            5 selected courses
        </span>

    </div>

    <div id="courseList"></div>

</div>


<!-- ======================================
     HOLIDAYS
     ====================================== -->

<div
    id="viewHolidays"
    class="hidden">

    <div class="section-title">

        <h2>
            Holidays
        </h2>

        <span>
            No-class days
        </span>

    </div>

    <div id="holidayList"></div>

</div>


<!-- ======================================
     BOTTOM NAVIGATION
     ====================================== -->

<nav
    class="nav"
    aria-label="Main navigation">

    <button
        class="active"
        data-view="Today">

        Today

    </button>


    <button
        data-view="Week">

        Week

    </button>


    <button
        data-view="Courses">

        Courses

    </button>


    <button
        data-view="Holidays">

        Holidays

    </button>

</nav>

</div>

/* =========================================
   DATE FUNCTIONS
   ========================================= */

function parseDate(s) {

    const [
        y,
        m,
        d
    ] = s
        .split("-")
        .map(Number);

    return new Date(
        Date.UTC(
            y,
            m - 1,
            d
        )
    );

}


function dateKey(d) {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: "Asia/Kolkata",

            year: "numeric",

            month: "2-digit",

            day: "2-digit"
        }
    ).format(d);

}


function todayKey() {

    return dateKey(new Date());

}


function formatDate(
    s,
    opts = {
        weekday: "short",
        month: "short",
        day: "numeric"
    }
) {

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            timeZone: "Asia/Kolkata",

            ...opts
        }
    ).format(
        parseDate(s)
    );

}


/* =========================================
   LIVE CLOCK
   ========================================= */

function formatClock() {

    return new Intl.DateTimeFormat(
        "en-IN",
        {
            timeZone: "Asia/Kolkata",

            hour: "numeric",

            minute: "2-digit",

            second: "2-digit",

            hour12: true
        }
    ).format(new Date());

}


/* =========================================
   TIME → MINUTES
   ========================================= */

function minutes(t) {

    const match =
        t.match(
            /(\d+):(\d+)\s*(AM|PM)/i
        );

    if (!match)
        return 0;

    let hour =
        Number(match[1]);

    const minute =
        Number(match[2]);

    const period =
        match[3].toUpperCase();


    if (
        period === "AM" &&
        hour === 12
    ) {

        hour = 0;

    }


    if (
        period === "PM" &&
        hour !== 12
    ) {

        hour += 12;

    }


    return (
        hour * 60 +
        minute
    );

}


/* =========================================
   CLASS CARD
   ========================================= */

function card(item) {

    const isToday =
        item.date === todayKey();


    return `

    <article
        class="card ${isToday ? "today" : ""}">

        <div class="time">

            <strong>
                ${item.start}
            </strong>

            <small>
                to ${item.end}
            </small>

        </div>


        <div class="info">

            <div class="code">
                ${item.code}
            </div>

            <div class="subject">
                ${item.subject}
            </div>


            <div class="meta">

                <span class="pill">
                    ${item.prof}
                </span>

                <span class="pill">
                    ${item.room}
                </span>

                <span class="pill">
                    ${item.week}
                </span>

            </div>

        </div>


        <span
            class="dot"
            aria-hidden="true">
        </span>

    </article>

    `;

}


/* =========================================
   GROUP CLASSES
   ========================================= */

function grouped(items) {

    const result = {};


    items.forEach(item => {

        if (!result[item.date]) {

            result[item.date] = [];

        }

        result[item.date].push(item);

    });


    Object.values(result)
        .forEach(list => {

            list.sort(
                (a,b) =>
                    minutes(a.start) -
                    minutes(b.start)
            );

        });


    return result;

}


/* =========================================

    const today =

    const list =

                    item.date === today
            )
            .sort(
                (a,b) =>
                    minutes(a.start) -
                    minutes(b.start)
            );


    document.getElementById(
        "todayLabel"
    ).textContent =

        formatDate(
            today,
            {

                month: "long",
                day: "numeric"

    document.getElementById(
        "todayList"

        list.length

        ?

        list.map(card).join("")

        :

        `

            ${

                        h[0] === today
                )

                : "No selected classes today."
            }

        `;

}


/* =========================================
   WEEK VIEW
   ========================================= */

function renderWeek() {

    const week =
        state.week;


    let list =
        DATA.filter(
            item =>
                item.week === week
        );


    if (
        state.course !== "ALL"
    ) {

        list =
            list.filter(
                item =>
                    item.code ===
                    state.course
            );

    }


    const query =
        state.search
            .trim()
            .toLowerCase();


    if (query) {

        list =
            list.filter(item => {

                const text = `

                    ${item.code}

                    ${item.subject}

                    ${item.prof}

                    ${item.room}

                `.toLowerCase();


                return text.includes(query);

            });

    }


    const groups =
        grouped(list);


    const dates =
        Object.keys(groups)
            .sort();


    document.getElementById(
        "weekList"
    ).innerHTML =

        dates.length

        ?

        dates.map(date => `

            <section class="day">

                <div class="day-head">

                    <span class="day-name">

                        ${
                            formatDate(
                                date,
                                {
                                    weekday:
                                        "long"
                                }
                            )
                        }

                    </span>


                    <span class="day-date">

                        ${formatDate(date)}

                    </span>

                </div>


                ${
                    groups[date]
                        .map(card)
                        .join("")
                }

            </section>

        `).join("")

        :

        `

        <div class="empty">

            No matching classes
            in ${week}.

        </div>

        `;

}

/* =========================================
   HOLIDAYS + NO CLASS DAYS
   ========================================= */

function renderHolidays() {

    const startDate =
        parseDate("2026-08-24");


    const endDate =
        parseDate("2026-10-11");


    const classesByDate = {};


    DATA.forEach(item => {

        classesByDate[item.date] ??= [];

        classesByDate[item.date].push(item);

    });


    const official = {};


    HOLIDAYS.forEach(item => {

        official[item[0]] = item;

    });


    const cards = [];


    for (

        let cursor =
            new Date(startDate);

        cursor <= endDate;

        cursor.setUTCDate(
            cursor.getUTCDate() + 1
        )

    ) {

        const key =
            cursor
                .toISOString()
                .slice(0,10);


        if (
            !classesByDate[key] ||
            classesByDate[key].length === 0
        ) {


            if (official[key]) {

                cards.push(`

                    <article
                        class="holiday">

                        <div
                            class="holiday-date">

                            ${
                                formatDate(
                                    key,
                                    {
                                        weekday:"long",
                                        month:"long",
                                        day:"numeric"
                                    }
                                )
                            }

                        </div>


                        <div
                            class="holiday-name">

                            ${official[key][1]}

                        </div>


                        <div
                            class="holiday-type">

                            ${official[key][2]}

                            · No classes for
                            your selected subjects

                        </div>

                    </article>

                `);

            }


            else {

                cards.push(`

                    <article
                        class="no-class">

                        <div
                            class="no-class-date">

                            ${
                                formatDate(
                                    key,
                                    {
                                        weekday:"long",
                                        month:"long",
                                        day:"numeric"
                                    }
                                )
                            }

                        </div>


                        <div
                            class="no-class-name">

                            Holiday · No Classes

                        </div>


                        <div
                            class="no-class-type">

                            No classes for
                            your selected subjects

                        </div>

                    </article>

                `);

            }

        }

    }


    document.getElementById(
        "holidayList"
    ).innerHTML =
        cards.join("");

}


/* =========================================
   FIND NEXT CLASS
   ========================================= */

function findNext() {

    const now =
        new Date();


    const today =
        todayKey();


    const nowTime =
        new Intl.DateTimeFormat(
            "en-IN",
            {
                timeZone:
                    "Asia/Kolkata",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12: false
            }
        )
        .format(now);


    const nowMin =
        Number(
            nowTime
                .replace(":","")
        );


    const sorted =
        [...DATA].sort(
            (a,b) =>

                a.date.localeCompare(
                    b.date
                )

                ||

                minutes(a.start) -
                minutes(b.start)
        );


    let next =
        sorted.find(
            item =>

                item.date > today

                ||

                (
                    item.date === today &&

                    minutes(item.start)
                    > nowMin
                )
        );


    if (!next) {

        next =
            sorted[0];

    }


    document.getElementById(
        "heroDate"
    ).textContent =

        next.date === today

        ?

        "NEXT CLASS"

        :

        formatDate(
            next.date,
            {
                weekday:"short",
                month:"short",
                day:"numeric"
            }
        );


    document.getElementById(
        "nextTitle"
    ).textContent =

        `${next.code} · ${next.start}`;


    document.getElementById(
        "nextSub"
    ).textContent =

        `${next.prof} · ${next.room}`;


    document.getElementById(
        "classCount"
    ).textContent =

        `${DATA.length} classes`;

}

    .forEach(name => {

        document
            .getElementById(

                "hidden",
                name !== view
            );


        document
            .querySelector(
                `[data-view="${name}"]`
            )
            .classList
            .toggle(
                "active",
                name === view
            );

    });

}
